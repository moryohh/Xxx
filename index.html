<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السبورة التفاعلية - رياضيات السادس العلمي</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paperBg: '#ffffff',
                        mathBlue: '#0ea5e9',
                        darkMath: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                        mono: ['Courier New', 'Courier', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Handwritten Paper Sheet Styling */
        .paper-sheet {
            background-color: #ffffff;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
            background-size: 100% 2.4rem;
            line-height: 2.4rem;
        }

        /* Red Input Boxes */
        .red-interactive-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            height: 42px;
            border: 2px solid #ef4444;
            background-color: #fef2f2;
            color: #991b1b;
            font-weight: 800;
            font-size: 1.15rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            padding: 0 8px;
            margin: 0 4px;
            vertical-align: middle;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.15);
            flex-shrink: 0;
            direction: ltr; /* Always LTR for math values */
        }

        .red-interactive-box:hover {
            background-color: #fee2e2;
            transform: scale(1.05);
            border-color: #dc2626;
        }

        .red-interactive-box.active {
            border: 3px solid #dc2626;
            background-color: #fca5a5;
            color: #7f1d1d;
            animation: pulseRed 1.5s infinite;
        }

        .red-interactive-box.solved {
            border: 2px solid #10b981;
            background-color: #ecfdf5;
            color: #047857;
            cursor: default;
            box-shadow: none;
        }

        @keyframes pulseRed {
            0%, 100% { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 0 7px rgba(239, 68, 68, 0.5); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        .math-line-container {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            direction: ltr; /* Force Math to LTR */
        }

        /* Hide sections for SPA navigation */
        .view-section { display: none; }
        .view-section.active { display: flex; animation: fadeIn 0.3s ease-in; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
        // --- 1. CURRICULUM DATABASE (رياضيات السادس العلمي - التوزيع الدقيق حسب صفحات الكتاب) ---

                topics: [

                    { name: "الزاوية الزوجية والمساقط", files: ["page_233.json", "page_239.json"] }
                ]
            }
        ];

        function getProblemDataForFile(fileName) {
            const pageNum = parseInt(fileName.replace(/\D/g, '')) || 19;

            if (pageNum <= 48) {
                // Chapter 1: Complex Numbers
                return {
                    file_name: fileName,
                    category: `الفصل الأول - الأعداد المركبة (صفحة ${pageNum})`,
                    title: "س/ جد قيمتي $x, y \\in \\mathbb{R}$ اللتين تحققان المعادلة:",
                    latex_formula: "y + 5i = (2x + i)(x + 2i)",
                    image_url: "",
                    steps: [
                        {
                            step_id: 1,
                            title: "الخطوة الأولى: فك الأقواس بالضرب والتوزيع",
                            explanation: "نستخدم التوزيع لضرب القوسين. تذكر أن $i^2 = -1$.",
                            think: "اضرب الحد الأول في القوس الثاني، ثم الثاني في القوس الثاني.",
                            html_structure: "y + 5i = ({inp_1})x^2 + ({inp_2})xi + xi + 2i^2",
                            inputs: [
                                { id: "inp_1", correct_value: "2", label: "معامل x²", allowed_keys: ["1", "2", "3", "4"], hint: "ضرب 2x في x يساوي 2x²." },
                                { id: "inp_2", correct_value: "4", label: "معامل xi الأول", allowed_keys: ["2", "4", "5", "6"], hint: "ضرب 2x في 2i يساوي 4xi." }
                            ]
                        },
                        {
                            step_id: 2,
                            title: "الخطوة الثانية: مساواة الحقيقي بالحقيقي والتخيلي بالتخيلي",
                            explanation: "تجميع الأجزاء التخيلية ومساواتها مع الطرف الأيسر.",
                            think: "التخيلي باليسار هو 5، وباليمين هو 5x.",
                            html_structure: "5 = {inp_3}x \\implies x = {inp_4}",
                            inputs: [
                                { id: "inp_3", correct_value: "5", label: "معامل x", allowed_keys: ["2", "5", "1", "3"], hint: "4xi + 1xi = 5xi." },

                            think: "اقسم الطرفين على 4.",

                            inputs: [

                    latex_formula: "\\left(\\frac{d^2y}{dx^2}\\right)^3 + 5\\left(\\frac{dy}{dx}\\right)^4 - y = 0",

                    steps: [

                                { id: "inp_1", correct_value: "2", label: "رتبة المعادلة", allowed_keys: ["1", "2", "3", "4"], hint: "أعلى مشتقة هي المشتقة الثانية." }
                            ]
                        },
                        {

                            explanation: "الدرجة هي القوة المرفوعة لأعلى مشتقة في المعادلة.",
                            think: "أس المشتقة الثانية هو 3.",
                            html_structure: "\\text{الدرجة} = {inp_2}",
                            inputs: [
                                { id: "inp_2", correct_value: "3", label: "درجة المعادلة", allowed_keys: ["1", "2", "3", "4"], hint: "القوة المرفوعة للمشتقة d²y/dx² هي 3." }

            } else {

                    category: `الفصل السادس - الهندسة الفضائية (صفحة ${pageNum})`,
                    title: "س/ مبرهنة (7): إذا تعامد مستويان فالمستقيم المرسوم في أحدهما والعمودي على مستقيم التقاطع يكون:",
                    latex_formula: "\\pi_1 \\perp \\pi_2 \\implies L \\perp \\pi_2",
                    image_url: "",
                    steps: [
                        {
                            step_id: 1,
                            title: "الخطوة الأولى: إكمال نص المبرهنة",
                            explanation: "تحديد العلاقة بين المستقيم والمستوي الثاني.",
                            think: "يكون عمودياً على المستوي الآخر.",
                            html_structure: "\\text{يكون عمودياً على } {inp_1}",
                            inputs: [
                                { id: "inp_1", correct_value: "المستوي الآخر", allowed_keys: ["المستوي الآخر", "مستقيم التقاطع", "نقطة التماس", "المستوي الأول"], hint: "المستقيم يكون عمودياً على المستوي الثاني." }
                            ]
                        }

                };
            }
        }

        function startWhiteboard(fileName, event) {
            if(event) event.stopPropagation();
            
            // Load interactive problem data according to page file
            currentProblemData = getProblemDataForFile(fileName);
            
            resetGameState();
            renderWhiteboardHeader();
            renderWhiteboardSteps();
            showScreen('view-whiteboard');
        }

        // Render Whiteboard Content
        function renderWhiteboardHeader() {
            document.getElementById('wb-category-label').innerHTML = `<i class="fa-solid fa-book text-mathBlue"></i> ${currentProblemData.category}`;
            document.getElementById('wb-file-name').textContent = currentProblemData.file_name;
            document.getElementById('questionTitle').innerHTML = currentProblemData.title; // allows math inline
            
            // Handle Supabase Image
            const imgEl = document.getElementById('problemImage');
            const imgContainer = document.getElementById('problemImageContainer');
            if(currentProblemData.image_url) {
                imgEl.src = currentProblemData.image_url;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            // Render Formula using KaTeX
            setTimeout(() => {
                 // Render inline math in title if any (hacky but works for demo)
                 document.getElementById('questionTitle').innerHTML = currentProblemData.title.replace(/\$(.*?)\$/g, (match, formula) => {
                    return katex.renderToString(formula, { throwOnError: false });
                 });

                 katex.render(currentProblemData.latex_formula, document.getElementById('mathFormulaDisplay'), {
                    throwOnError: false, displayMode: true
                 });
            }, 50);
        }

        function renderWhiteboardSteps() {
            const container = document.getElementById('interactiveCanvasContainer');
            container.innerHTML = "";

            currentProblemData.steps.forEach((step) => {
                const stepWrapper = document.createElement('div');
                stepWrapper.className = "p-4 md:p-6 rounded-2xl bg-white border-2 border-slate-100 shadow-sm transition-all";
                
                const explanationHtml = step.explanation ? `
                    <div class="mb-5 bg-sky-50/50 border-r-4 border-mathBlue p-4 rounded-l-xl text-sm font-bold text-sky-900 leading-relaxed dir-rtl relative">
                        <i class="fa-solid fa-chalkboard-user absolute -right-3 top-4 text-sky-300 bg-white rounded-full p-1 border border-sky-100 text-lg"></i>
                        <span class="mr-3 block">${step.explanation}</span>
                    </div>
                ` : '';

                // Process the HTML structure to inject KaTeX and Interactive Boxes
                // We use a custom string format in JSON: "y + 5i = ({inp_1})x^2..."
                let processedMath = step.html_structure;
                
                // Replace {inp_X} with actual box HTML
                step.inputs.forEach(inp => {
                    processedMath = processedMath.replace(`{${inp.id}}`, getBoxHtml(inp.id));
                });

                let html = `
                    <div class="text-sm font-black text-slate-700 mb-4 flex items-center gap-2 dir-rtl">
                        <span class="w-3 h-3 rounded-full bg-mathBlue shrink-0"></span>
                        <span>${step.title}</span>
                    </div>
                    ${explanationHtml}
                    <div class="math-line-container text-xl md:text-2xl font-extrabold text-slate-900 dir-ltr flex items-center justify-start gap-2 w-full pt-2">
                         <!-- Render parts as math where possible, keeping inputs interactive -->
                         <div class="flex items-center gap-1 font-mono tracking-wide" id="step-math-${step.step_id}">
                            ${processedMath}
                         </div>
                    </div>
                `;
                
                stepWrapper.innerHTML = html;
                container.appendChild(stepWrapper);
            });

            // Find first unsolved input
            setFirstActiveInput();
            updateProgress();
        }

        function getBoxHtml(inputId) {
            const val = userAnswers[inputId];
            const isActive = (currentActiveInputId === inputId);
            const classList = `red-interactive-box ${val ? 'solved' : (isActive ? 'active' : '')}`;
            
            let displayContent = val ? val : (isActive ? `<span class="opacity-40 text-xs animate-pulse"><i class="fa-solid fa-pen"></i></span>` : ``);

            return `<div onclick="openChoicesForInput('${inputId}')" id="box_${inputId}" class="${classList}">${displayContent}</div>`;
        }

        function setFirstActiveInput() {
            currentActiveInputId = null;
            for(let step of currentProblemData.steps) {
                for(let inp of step.inputs) {
                    if(!userAnswers[inp.id]) {
                        currentActiveInputId = inp.id;
                        return; // Stop at first unsolved
                    }
                }
            }
        }

        // --- Interaction Logic ---
        
        function openChoicesForInput(inputId) {
            if (userAnswers[inputId]) return; // Already solved
            
            currentActiveInputId = inputId;
            renderWhiteboardSteps(); // Re-render to update active styling

            const targetInput = getCurrentTargetInput();
            if (!targetInput) return;

            document.getElementById('choicesTargetLabel').textContent = targetInput.label;
            
            const container = document.getElementById('choicesContainer');
            container.innerHTML = "";

            let choices = [...targetInput.allowed_keys];
            choices.sort(() => Math.random() - 0.5); // Shuffle

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "w-full py-4 bg-slate-50 hover:bg-slate-100 text-slate-800 font-mono font-black rounded-xl text-xl border-2 border-slate-200 flex items-center justify-center shadow-sm transition active:scale-95";
                
                // If choice contains complex math, render it (simple check)
                if(choice.includes('^') || choice.includes('\\')) {
                    katex.render(choice, btn, { throwOnError: false });
                } else {
                    btn.textContent = choice;
                }
                
                btn.onclick = () => submitChoice(choice, targetInput.correct_value);
                container.appendChild(btn);
            });

            document.getElementById('choicesPopover').classList.remove('hidden');
        }

        function submitChoice(selectedVal, correctVal) {
            if (selectedVal.trim() === correctVal.trim()) {
                // Correct
                userAnswers[currentActiveInputId] = selectedVal;
                closeChoicesPopover();
                
                setFirstActiveInput();
                renderWhiteboardSteps();
                updateProgress();
                
                if (!currentActiveInputId) {
                    // All done!
                    document.getElementById('completionBanner').classList.remove('hidden');
                    document.getElementById('hintBtn').disabled = true;
                    document.getElementById('helpBtn').disabled = true;
                }
            } else {
                // Incorrect
                deductHearts();
            }
        }

        function getCurrentTargetInput() {
            if(!currentProblemData) return null;
            let target = null;
            currentProblemData.steps.forEach(s => s.inputs.forEach(i => {
                if (i.id === currentActiveInputId) target = i;
            }));
            return target;
        }
        
        function getCurrentStep() {
            if(!currentProblemData) return null;
            let current = null;
            currentProblemData.steps.forEach(s => s.inputs.forEach(i => {
                if (i.id === currentActiveInputId) current = s;
            }));
            return current;
        }

        function closeChoicesPopover() {
            document.getElementById('choicesPopover').classList.add('hidden');
        }

        // Gamification & Progress
        function updateGamificationUI() {
            document.getElementById('applesCount').textContent = apples;
            document.getElementById('heartsCount').textContent = hearts;
            const heartIcon = document.querySelector('.fa-heart');
            if(hearts <= 3) heartIcon.classList.add('text-red-600', 'animate-ping');
            else heartIcon.classList.remove('text-red-600', 'animate-ping');
        }

        function deductHearts() {
            hearts--;
            updateGamificationUI();
            const box = document.getElementById(`box_${currentActiveInputId}`);
            if(box) {
                box.classList.add('shake-animation');
                setTimeout(() => box.classList.remove('shake-animation'), 400);
            }
            if(hearts <= 0) {
                setTimeout(() => {
                    alert("لقد فقدت جميع محاولاتك! أعد المحاولة من جديد.");
                    resetGameState();
                    renderWhiteboardSteps();
                }, 500);
            }
        }

        function deductApples(amount) {
            if (apples >= amount) {
                apples -= amount;
                updateGamificationUI();
                return true;
            }
            alert("عذراً، لا تملك تفاحاً كافياً!");
            return false;
        }

        function updateProgress() {
            if(!currentProblemData) return;
            let total = 0, solved = 0;
            currentProblemData.steps.forEach(s => s.inputs.forEach(i => {
                total++;
                if (userAnswers[i.id]) solved++;
            }));
            const pct = (solved / total) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        function resetGameState() {
            userAnswers = {};
            hearts = 10;
            document.getElementById('completionBanner').classList.add('hidden');
            document.getElementById('hintBtn').disabled = false;
            document.getElementById('helpBtn').disabled = false;
            updateGamificationUI();
        }

        // Tools
        function useHelpSolve() {
            const targetInput = getCurrentTargetInput();
            if(!targetInput || userAnswers[targetInput.id]) return;
            if(deductApples(4)) submitChoice(targetInput.correct_value, targetInput.correct_value);
        }

        function useHint() {
            const targetInput = getCurrentTargetInput();
            if(!targetInput || userAnswers[targetInput.id]) return;
            if(deductApples(2)) openToolModal('hint');
        }

        function openToolModal(type) {
            const header = document.getElementById('toolModalHeader');
            const body = document.getElementById('toolModalBody');
            const currentStep = getCurrentStep();
            const currentInput = getCurrentTargetInput();

            if(!currentStep) return;

            if (type === 'think') {
                header.innerHTML = `<span class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center text-lg"><i class="fa-solid fa-brain"></i></span>
                                    <div><h3 class="font-black text-slate-900 text-base">فِكْر (الخارطة الذهنية)</h3></div>`;
                body.innerHTML = currentStep.think;
            } else if (type === 'hint' && currentInput) {
                header.innerHTML = `<span class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-lg"><i class="fa-solid fa-lightbulb"></i></span>
                                    <div><h3 class="font-black text-slate-900 text-base">تلميح مخصص للخانة</h3></div>`;
                body.innerHTML = currentInput.hint;
            }
            document.getElementById('toolModal').classList.remove('hidden');
            closeChoicesPopover();
        }

        function closeToolModal() {
            document.getElementById('toolModal').classList.add('hidden');
        }

        function toggleCalculator() {
            document.getElementById('calcModal').classList.toggle('hidden');
        }

        function calcPress(val) {
            const disp = document.getElementById('calcDisplay');
            if (disp.value === '0' || disp.value === 'خطأ') disp.value = '';
            if (val === 'C') disp.value = '0';
            else disp.value += val;
        }

        function calcEval() {
            const disp = document.getElementById('calcDisplay');
            try { disp.value = eval(disp.value); } 
            catch (e) { disp.value = 'خطأ'; }
        }

    </script>
</body>
</html>
